name: Active Users Weekly Report

on:
  schedule:
    # 毎週金曜日の午前8時（JST）に実行
    # UTC時間で毎週木曜日の午後11時（23:00 UTC = 08:00 JST）
    - cron: '0 23 * * 4'
  workflow_dispatch: # 手動実行も可能にする

permissions:
  contents: read

jobs:
  active-users:
    name: Collect Active Users
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env.local file
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}" > .env.local
          echo "SUPABASE_SERVICE_ROLE=${SUPABASE_SERVICE_ROLE}" >> .env.local

      - name: Run active users check
        id: active-users
        run: |
          set +e
          OUTPUT=$(npm run active:users 2>&1)
          EXIT_CODE=$?
          set -e
          echo "exit_code=${EXIT_CODE}" >> $GITHUB_OUTPUT
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          # 出力をファイルにも保存（デバッグ用）
          echo "$OUTPUT" > active-users-output.txt
        continue-on-error: true

      - name: Send webhook notification
        if: always()
        run: |
          # デバッグ: ファイルの存在確認
          if [ ! -f active-users-output.txt ]; then
            echo "Warning: active-users-output.txt not found, using empty output"
            echo "" > active-users-output.txt
          fi

          # Node.jsでJSONペイロードを作成して送信
          node << 'EOF'
          const fs = require('fs');
          const { sendLarkCard, div, hr, note } = require('./scripts/lark-notify.cjs');

          console.log('Starting webhook notification...');
          console.log('STATUS:', process.env.STATUS);
          console.log('Repository:', process.env.GITHUB_REPOSITORY);
          console.log('Run ID:', process.env.GITHUB_RUN_ID);

          let output = '';
          try {
            output = fs.readFileSync('active-users-output.txt', 'utf-8');
            console.log('Output file read successfully, length:', output.length);
          } catch (error) {
            console.warn('Failed to read output file:', error.message);
            output = 'Output file not available';
          }

          const isSuccess = process.env.STATUS === 'success';
          const statusEmoji = isSuccess ? '✅' : '❌';
          const statusText = isSuccess ? '成功' : '失敗';
          const workflowUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

          // output は check-active-users.ts 側で既に lark_md エスケープ済みのため、ここでは再エスケープしない
          const elements = [
            div(`**${statusEmoji} ${statusText}**`),
            hr(),
            div(`**👥 アクティブユーザー情報（直近1週間）**\n${output}`),
            hr(),
            note(`[実行ログを見る](${workflowUrl})`),
          ];

          sendLarkCard({
            webhookUrl: process.env.ACTIVE_USERS_WEBHOOK_URL,
            title: `👥 アクティブユーザーレポート：${statusText}`,
            template: isSuccess ? 'green' : 'red',
            elements,
          })
            .then(() => process.exit(0))
            .catch((error) => {
              console.error('ERROR:', error.message);
              process.exit(1);
            });
          EOF

        env:
          STATUS: ${{ steps.active-users.outputs.exit_code == '0' && 'success' || 'failure' }}
          ACTIVE_USERS_WEBHOOK_URL: ${{ secrets.ACTIVE_USERS_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
