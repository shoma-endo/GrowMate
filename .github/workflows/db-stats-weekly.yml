name: Database Stats Weekly Report

on:
  schedule:
    # 毎週月曜日の午前9時（JST）に実行
    # UTC時間で毎週日曜日の午後11時（23:00 UTC = 09:00 JST）
    - cron: '0 23 * * 0'
  workflow_dispatch: # 手動実行も可能にする

permissions:
  contents: read

jobs:
  db-stats:
    name: Collect Database Statistics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache db stats history
        uses: actions/cache@v4
        with:
          path: scripts/db-stats-history.json
          key: db-stats-history-${{ github.run_id }}
          restore-keys: |
            db-stats-history-

      - name: Create .env.local file
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}" > .env.local
          echo "SUPABASE_SERVICE_ROLE=${SUPABASE_SERVICE_ROLE}" >> .env.local

      - name: Run database stats
        id: db-stats
        run: |
          set +e
          OUTPUT=$(npm run db:stats 2>&1)
          EXIT_CODE=$?
          set -e
          echo "exit_code=${EXIT_CODE}" >> $GITHUB_OUTPUT
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          # 出力をファイルにも保存（デバッグ用）
          echo "$OUTPUT" > db-stats-output.txt
        continue-on-error: true

      - name: Send webhook notification
        if: always()
        run: |
          # デバッグ: ファイルの存在確認
          if [ ! -f db-stats-output.txt ]; then
            echo "Warning: db-stats-output.txt not found, using empty output"
            echo "" > db-stats-output.txt
          fi

          # Node.jsでJSONペイロードを作成して送信
          node << 'EOF'
          const fs = require('fs');
          const { escapeLarkMd, sendLarkCard, div, hr, note } = require('./scripts/lark-notify.cjs');

          console.log('Starting webhook notification...');
          console.log('STATUS:', process.env.STATUS);
          console.log('Repository:', process.env.GITHUB_REPOSITORY);
          console.log('Run ID:', process.env.GITHUB_RUN_ID);

          let output = '';
          try {
            output = fs.readFileSync('db-stats-output.txt', 'utf-8');
            console.log('Output file read successfully, length:', output.length);
          } catch (error) {
            console.warn('Failed to read output file:', error.message);
            output = 'Output file not available';
          }

          const isSuccess = process.env.STATUS === 'success';
          const statusEmoji = isSuccess ? '✅' : '❌';
          const statusText = isSuccess ? '成功' : '失敗';
          const workflowUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

          const elements = [
            div(`**${statusEmoji} ${statusText}**`),
            hr(),
            div(`**📊 統計情報**\n\`\`\`\n${escapeLarkMd(output)}\n\`\`\``),
            hr(),
            note(`[実行ログを見る](${workflowUrl})`),
          ];

          sendLarkCard({
            webhookUrl: process.env.DB_STATS_WEBHOOK_URL,
            title: `📊 データベース統計レポート：${statusText}`,
            template: isSuccess ? 'green' : 'red',
            elements,
          })
            .then(() => process.exit(0))
            .catch((error) => {
              console.error('ERROR:', error.message);
              process.exit(1);
            });
          EOF

        env:
          STATUS: ${{ steps.db-stats.outputs.exit_code == '0' && 'success' || 'failure' }}
          DB_STATS_WEBHOOK_URL: ${{ secrets.DB_STATS_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
