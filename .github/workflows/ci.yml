name: CI

# push 起動に一本化している（2026-09-03）。
# auto-pr.yml が GITHUB_TOKEN で作る PR の pull_request イベントは承認待ち（action_required）で
# 止まり、毎回 approve API を手で叩いていた。branch protection は無く必須チェックの契約も無いので、
# 全ブランチの push で同じ SHA を検証し、PR の Checks には commit のステータスとして表示させる。
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

# 同じブランチへの連続 push は古い run を捨てる
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1ジョブに直列でまとめている。ジョブごとに課金が1分へ切り上がり、
  # 並列6ジョブ（各20〜60秒）だと1回あたり約6.4分、直列1ジョブだと約2分になるため。
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        id: install
        run: npm ci

      # 以降の検査は前の検査が落ちても走らせ、1回の run で失敗をすべて出す
      - name: Run npm audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --omit=dev --audit-level=high

      # dev 依存の脆弱性は本番バンドルに載らないため CI をブロックしない。
      # ただしサプライチェーン攻撃の検知は残したいので、警告として可視化する。
      - name: Run npm audit (dev dependencies, non-blocking)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          if ! npm audit --audit-level=high; then
            echo "::warning::dev 依存に high 以上の脆弱性があります（本番バンドル対象外のためブロックしません）"
          fi

      - name: Run Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Run tests (with coverage thresholds)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:coverage

      - name: Build application
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
        env:
          # クライアント環境変数（ビルド時に必須）
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # サーバー環境変数（ビルド時に必須）
          SUPABASE_SERVICE_ROLE: dummy-service-role
          OPENAI_API_KEY: sk-dummy
          ANTHROPIC_API_KEY: sk-ant-dummy

      - name: Run Knip
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run knip

      - name: Send webhook notification
        if: always()
        run: |
          # Node.jsでJSONペイロードを作成して送信
          node << 'EOF'
          const { escapeLarkMd, sendLarkCard, div, hr, note } = require('./scripts/lark-notify.cjs');

          const isSuccess = process.env.STATUS === 'success';
          const statusEmoji = isSuccess ? '✅' : '❌';
          const statusText = isSuccess ? '成功' : '失敗';
          const executionType = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' ? '手動' : '自動';
          const actor = process.env.GITHUB_ACTOR || '不明';
          const branch = process.env.GITHUB_REF_NAME || '不明';

          // PRタイトル・コミットメッセージはユーザーが自由に書き込める値のため、
          // lark_mdのMarkdown/メンション記法として解釈されないようエスケープする
          const commitMsg = escapeLarkMd(process.env.COMMIT_MSG || process.env.PR_TITLE || '');
          const commitLine = commitMsg ? `\nコミット: ${commitMsg.split('\n')[0]}` : '';
          const prUrl = process.env.PR_URL;
          const prLine = prUrl ? `\n[PR](${prUrl})` : '';

          const elements = [
            div(`**${statusEmoji} ${statusText}**\n実行: ${executionType}\nユーザー: ${actor}\nブランチ: ${branch}${commitLine}${prLine}`),
          ];

          const runUrl = process.env.ACTIONS_RUN_URL;
          if (runUrl) {
            elements.push(hr(), note(`[ログを見る](${runUrl})`));
          }

          sendLarkCard({
            webhookUrl: process.env.CI_WEBHOOK_URL,
            title: `🔧 CI ビルド結果：${statusText}`,
            template: isSuccess ? 'green' : 'red',
            elements,
          })
            .then(() => process.exit(0))
            .catch((error) => {
              console.error('ERROR:', error.message);
              process.exit(1);
            });
          EOF

        env:
          STATUS: ${{ job.status }}
          CI_WEBHOOK_URL: ${{ secrets.CI_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
