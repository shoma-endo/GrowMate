# ローカル TAKT 用。Cloud 無人の主系は cloud-agent-unattended Skill（TAKT CLI ではない）。
# provider/model 割当は .takt/runtime.yaml が正本（config.yaml に書くと doctor が mixed provider で落ちる）。
base_branch: develop
# takt run / takt watch で失敗したタスクを1回だけ自動で積み直す。2回目の失敗は積み直さずに止まり、
# TAKT_NOTIFY_WEBHOOK があれば run summary で通知される（docs/runbooks/takt-overnight-preflight.md）。
auto_requeue_max_attempts: 1
# 権限の解決順は project の step 上書き > global の step 上書き > project の既定 > global の既定。
# full（Claude では bypassPermissions）はどこにも書かない。scripts/takt-preflight.sh が inspect の解決結果で検査する。
provider_profiles:
  claude-sdk:
    default_permission_mode: edit
    step_permission_overrides:
      plan: readonly
      # Claude SDK の edit（acceptEdits）は allowed_tools に無い Edit / Write も自動承認するため、
      # 編集しない step は readonly にする。loop judge は合成 step 名で引かれる
      _loop_judge_ui_evidence_reviewers_review_fix: readonly
      _loop_judge_reviewers_review: readonly
      _loop_judge_self_review_self_review_fix_ui_evidence_recheck: readonly
      _loop_judge_self_review_fix_ui_evidence_recheck_self_review_final_gate: readonly
      ai_antipattern_review: readonly
      architecture_review: readonly
      frontend_review: readonly
      review: readonly
      self_review: readonly
      final_gate: readonly
      prepare_pr_summary: readonly
      identify: readonly
      audit: readonly
# global の rate_limit_fallback（claude-headless → codex → cursor）を上書きする。切り替え先でも
# claude-sdk の provider_profiles が効くよう、claude-sdk の別モデルだけにする（cursor は full になる）
rate_limit_fallback:
  switch_chain:
    - provider: claude-sdk
      model: sonnet
workflow_command_gates:
  custom_scripts: true
workflow_runtime_prepare:
  custom_scripts: true
observability:
  enabled: true
  usage_events_phase: true
# Grill Me の system prompt は TAKT 本体固定のため、対話中の表示書式は init_files で渡す。
# init_files は全対話モードに効くので、Grill Me だけに絞る条件はファイル側に書く。
assistant:
  init_files:
    - .takt/workflows/rules/grill-me-display.md
