# ローカル TAKT 用。Cloud 無人の主系は cloud-agent-unattended Skill（TAKT CLI ではない）。
# provider/model 割当は ~/.takt/runtime.yaml が正本（config.yaml に書くと doctor が mixed provider で落ちる）。
base_branch: develop
workflow_command_gates:
  custom_scripts: true
workflow_runtime_prepare:
  custom_scripts: true
observability:
  enabled: true
  usage_events_phase: true
# Grill Me の system prompt は TAKT 本体固定のため、対話中の表示書式は init_files で渡す。
# init_files は全対話モードに効くので、Grill Me だけに絞る条件はファイル側に書く。
assistant:
  init_files:
    - .takt/workflows/rules/grill-me-display.md
