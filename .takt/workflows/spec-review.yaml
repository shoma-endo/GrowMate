name: spec-review
description: GrowMate docs/plans specification review against spec-review skill checklist and spec revision loop. Regenerates the spec's HTML visualization when the spec changed. Commits docs changes on the current branch only (no new branch, no push). Run before spec-to-pr.
max_steps: 14
initial_step: identify
loop_monitors:
  - cycle:
      - audit
      - revise
    threshold: 3
    judge:
      persona: supervisor
      knowledge:
        - growmate
      instruction: |
        audit -> revise のループが {cycle_count} 回繰り返されました。
        Report Directory の最新 audit 結果と修正内容を確認し、収束しているか判断してください。
        残件が「クライアント確認質問への回答待ち」のみの場合は、仕様書修正で解消不能な論点として visualize に進めてください。
      rules:
        - condition: 収束済み（残件がクライアント確認質問のみ）
          next: visualize
        - condition: 健全（進捗あり）
          next: audit
        - condition: 非生産的（同じ指摘の反復・修正未反映）
          next: ABORT

steps:
  - name: identify
    tags:
      - plan
    edit: false
    persona: planner
    knowledge:
      - growmate
    provider_options:
      extends: review-readonly
    instruction: |
      レビュー対象の仕様書を特定し、適用する観点を決定してください。

      必須手順:
      1. ユーザー指示から対象仕様書（`docs/plans/` 配下）を特定する。曖昧な場合は `docs/plans/` を列挙し、候補を示して ABORT する。
      2. `.agents/skills/spec-review/SKILL.md` を読む。
      3. 対象仕様書と `docs/context/client-vision-from-lark.md` を読む。
      4. spec-review skill のルーティング表に従い、対象仕様書に適用する条件付き観点（クライアント整合 / LLM / UI / データ / Google 連携）を判定し、対応する正本ファイルを列挙する。
      5. 仕様書が対象とする機能の既存実装（`src/server/services/*`、`src/server/actions/*`、関連画面）を grep で把握する。
    rules:
      - condition: 対象仕様書と適用観点を確定した
        next: audit
      - condition: ユーザーが質問をしている（レビュータスクではない）
        next: COMPLETE
      - condition: 対象仕様書を特定できない
        next: ABORT
        appendix: |
          候補仕様書:
          - {候補1}
          - {候補2}
    output_contracts:
      report:
        - name: spec-review-scope.md
          format: plan

  - name: audit
    tags:
      - review
    edit: false
    persona: architecture-reviewer
    knowledge:
      - architecture
      - growmate
    provider_options:
      extends: review-readonly
    instruction: |
      `.agents/skills/spec-review/SKILL.md` を正本として、対象仕様書をレビューしてください。

      必須条件:
      - 共通観点 A（完全性）/ B（既存コード整合）/ C（非機能）/ D（セキュリティ）を全項目確認する。
      - `spec-review-scope.md` で判定された条件付き観点の正本ファイルを読み、該当チェックリストを適用する。
      - B の確認では仕様書の記述を鵜呑みにせず、実コード（services / actions / components）を読んで再利用対象・乖離を検証する。
      - 指摘は「問題箇所 / なぜ危険か / 修正案」の形式で、重大度（🔴/🟡/🟢）を付ける。
      - クライアント確認が必要な論点は修正案を断定せず、確認質問（Pre-implementation Questions 形式）として隔離する。
      - 判定基準: 🔴 がゼロ、かつ 🟡 が修正済みまたは理由付きで残置合意済みなら approved。エージェントが解消できる 🔴/🟡 があれば needs_fix。残件がクライアント確認質問のみなら approved_with_questions。
    rules:
      - condition: approved（自己解消可能な指摘なし・確認質問もなし）
        next: visualize
      - condition: approved_with_questions（残件がクライアント確認質問のみ）
        next: visualize
      - condition: needs_fix（仕様書修正で解消できる指摘がある）
        next: revise
    output_contracts:
      report:
        - name: spec-audit.md
          format: architecture-review

  - name: revise
    tags:
      - implementation
    edit: true
    persona: coder
    knowledge:
      - growmate
    provider_options:
      extends: edit
    required_permission_mode: edit
    pass_previous_response: false
    instruction: |
      Report Directory の `spec-audit.md` を一次情報として、対象仕様書の未解決指摘だけを修正してください。

      必須条件:
      - 編集対象は `docs/` 配下の対象仕様書（および付随する docs）に限定する。プロダクションコード・設定ファイルは一切編集しない。
      - クライアント確認が必要な論点は本文を確定させず、仕様書内に「未確定事項（クライアント確認中）」セクションとして質問ごと明記する。
      - 指摘への対応方針が複数あり判断できない場合は、勝手に選ばず ABORT する。
      - 修正した指摘と、対応しなかった指摘（理由付き）を報告する。
    rules:
      - condition: 指摘を修正した
        next: audit
      - condition: 修正方針を判断できない、情報不足
        next: ABORT
    output_contracts:
      report:
        - name: spec-revise-result.md
          format: coder-decisions

  - name: visualize
    tags:
      - implementation
    edit: true
    persona: coder
    knowledge:
      - growmate
    provider_options:
      extends: edit
    required_permission_mode: edit
    instruction: |
      `.agents/skills/spec-to-html/SKILL.md` を正本として、対象仕様書の図解 HTML を最新化してください。

      最初に実行要否を判定する:
      1. `git status --porcelain docs/plans/` と `git diff --stat HEAD -- docs/plans/` で、本ランで対象仕様書が変更されたかを確認する。
      2. `docs/plans/_html/<slug>/core.yaml` の有無を確認する（`<slug>` は対象仕様書のファイル名から `.md` を除いたもの）。
      3. **対象仕様書が未変更、かつ `docs/plans/_html/<slug>.html` が既に存在する**場合は、生成を行わずスキップした旨だけ報告して次に進む。

      実行する場合:
      - 再構成ビュー（01 ステータス / 02 設計判断 / 03 クイズ）: `core.yaml` が既にあるなら **更新モード**。仕様書の差分に対応する `concepts` / `relations` / `risks` / `questions` だけを直し、id は安定させる。全書き直しはしない。`core.yaml` が無いなら **新規モード**で SKILL.md の手順に従って起案する。
      - 全文ビュー（04）: **手で書かず** `python3 scripts/spec-html.py fulltext --spec <対象仕様書> --out docs/plans/_html/<slug>/views/04-fulltext.html` で機械変換する。仕様書が変わっていれば必ず再生成する。
      - 結合は必ず `python3 scripts/spec-html.py build` に4ビューすべてを渡して行う。安全検査で落ちた場合は違反箇所を直して再実行する。
      - 生成結果を headless Chrome の `--dump-dom` で確認し、パネル数が 4、`hidden` が 3 であることを検証する。

      必須条件:
      - 編集対象は `docs/plans/_html/` 配下に限定する。仕様書本文・プロダクションコード・設定ファイルは一切編集しない。
      - `docs/plans/_html/` は `.gitignore` 済みのため commit しない。commit は次の finalize の責務。
      - 図解生成に失敗しても ABORT しない。レビュー結果の commit を妨げないよう、失敗理由を報告して finalize に進む。
    rules:
      - condition: 図解を更新した、または対象外としてスキップした
        next: finalize
      - condition: 図解の生成に失敗した（理由を報告し、レビュー結果の commit は妨げない）
        next: finalize
    output_contracts:
      report:
        - name: spec-visualize-result.md
          format: coder-decisions

  - name: finalize
    tags:
      - coding
      - report
    edit: true
    persona: coder
    provider: claude
    model: haiku
    knowledge:
      - growmate
    required_permission_mode: edit
    provider_options:
      claude:
        allowed_tools:
          - Read
          - Glob
          - Grep
          - Bash
    instruction: |
      レビュー結果を確定し、仕様書に変更がある場合は現在のブランチに commit してください。新しいブランチの作成・push・PR 操作は行わないでください。

      手順:
      1. `git status` / `git diff` で変更内容を確認する。変更が `docs/` 配下のみであることを検証し、それ以外の変更が混入していれば ABORT する。
      2. 仕様書に変更がある場合: 現在のブランチのまま、日本語1行メッセージで commit する。ブランチ作成（`git checkout -b` / `git switch -c` 等）と `git push` は行わない。
      3. 仕様書に変更がない場合（指摘なし approved）: commit は行わない。
      4. 最終レポートに以下を含める: 指摘サマリ（重大度別件数）、未解決のクライアント確認質問、図解 HTML の更新有無とパス（`docs/plans/_html/<slug>.html`。commit 対象外）、次アクション（質問回答 → 必要なら人間が push/PR → `.takt/workflows/spec-to-pr.yaml` で実装）。

      やらないこと:
      - 新しいブランチの作成・切り替え。
      - `git push`（`-u` 含む）。
      - PR の作成・更新・マージ・クローズ（`gh pr create` / `gh pr edit` / `gh pr comment` 含む）。
      - `docs/` 以外の編集・コミット。
    rules:
      - condition: レビュー確定（commit 完了、または変更なしで完了）
        next: COMPLETE
      - condition: docs 以外の変更が混入している、または commit に失敗した
        next: ABORT
    output_contracts:
      report:
        - name: spec-review-summary.md
          format: summary
