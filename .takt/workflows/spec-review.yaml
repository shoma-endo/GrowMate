name: spec-review
description: GrowMate docs/plans specification review against spec-review skill checklist and spec revision loop. A review cannot complete while in-scope client questions, implementation decisions, external inputs, or approval gates remain unresolved. Regenerates the spec's HTML visualization when the spec changed. Commits docs changes on the current branch only (no new branch, no push). Run before spec-to-pr.
workflow_config:
  provider_options:
    codex:
      network_access: true
max_steps: 12
initial_step: identify
loop_monitors:
  - cycle:
      - audit
      - revise
    threshold: 3
    judge:
      persona: supervisor
      knowledge:
        - growmate
      instruction: |
        audit -> revise のループが {cycle_count} 回繰り返されました。
        下記に全文添付された最新の audit 結果と修正内容を確認し、収束しているか判断してください。run ディレクトリやレポートパスの探索はしないでください。
        残件が「クライアント確認質問・実装判断・外部入力・承認ゲートへの回答待ち」のみの場合も、
        レビュー完了とはみなしません。`ABORT` し、確定内容を仕様書へ反映してから spec-review を再実行してください。

        ## spec-audit.md（最新・全文）
        {report:spec-audit.md}

        ## spec-revise-result.md（最新・全文）
        {report:spec-revise-result.md}
      rules:
        - condition: 収束済み（残件が対象スコープの質問・実装判断・外部入力・承認ゲート待ちのみ）
          next: ABORT
          appendix: |
            対象スコープの未解決事項が残っています。回答・確定内容を対象仕様書へ反映し、
            `spec-review` を再実行してください。未確定のまま `spec-to-pr` は実行しないでください。
        - condition: 健全（進捗あり）
          next: audit
        - condition: 非生産的（同じ指摘の反復・修正未反映）
          next: ABORT

steps:
  - name: identify
    tags:
      - plan
    edit: false
    persona: planner
    provider: claude-sdk
    knowledge:
      - growmate
    capabilities: readonly
    instruction: spec-review-identify
    rules:
      - condition: 対象仕様書と適用観点を確定した
        next: audit
      - condition: ユーザーが質問をしている（レビュータスクではない）
        next: COMPLETE
      - condition: 対象仕様書を特定できない
        next: ABORT
        appendix: |
          候補仕様書:
          - {候補1}
          - {候補2}
    output_contracts:
      report:
        - name: spec-review-scope.md
          format: plan

  - name: audit
    tags:
      - review
    edit: false
    persona: architecture-reviewer
    provider: claude-sdk
    knowledge:
      - growmate
    capabilities: readonly
    instruction: spec-review-audit
    structured_output:
      schema_ref: audit
    rules:
      # spec-audit.md の見出し語彙（APPROVE/REJECT）と structured verdict は独立。
      # ルーティングは verdict の enum のみで判定する（自由記述の語彙ズレを判定に持ち込まない）。
      - condition: when(structured.audit.verdict == "approved")
        next: visualize
      - condition: when(structured.audit.verdict == "approved_with_questions")
        next: ABORT
        appendix: |
          対象スコープの未解決事項が残っています。回答・確定内容を対象仕様書へ反映し、
          `spec-review` を再実行してください。未確定のまま `spec-to-pr` は実行しないでください。
      - condition: when(structured.audit.verdict == "needs_fix")
        next: revise
    output_contracts:
      report:
        - name: spec-audit.md
          format: architecture-review

  - name: revise
    tags:
      - implementation
    edit: true
    persona: coder
    provider: claude-sdk
    knowledge:
      - growmate
    provider_options:
      extends: edit
    required_permission_mode: edit
    pass_previous_response: false
    instruction: spec-review-revise
    rules:
      - condition: 指摘を修正した
        next: audit
      - condition: 修正方針を判断できない、情報不足
        next: ABORT
    output_contracts:
      report:
        - name: spec-revise-result.md
          format: coder-decisions

  - name: visualize
    tags:
      - implementation
    edit: true
    persona: coder
    knowledge:
      - growmate
    provider_options:
      extends: edit
    required_permission_mode: edit
    instruction: spec-review-visualize
    rules:
      - condition: 図解を更新した、または対象外としてスキップした
        next: finalize
      - condition: 図解の生成に失敗した（理由を報告し、レビュー結果の commit は妨げない）
        next: finalize
    output_contracts:
      report:
        - name: spec-visualize-result.md
          format: coder-decisions

  - name: finalize
    tags:
      - coding
      - report
    edit: true
    persona: coder
    provider: cursor
    model: gpt-5.6-luna-high
    knowledge:
      - growmate
    required_permission_mode: edit
    allow_git_commit: true
    instruction: spec-review-finalize
    rules:
      - condition: レビュー確定（commit 完了、または変更なしで完了）
        next: COMPLETE
      - condition: docs/ の commit に失敗した、または docs/ 以外をステージ・コミットした
        next: ABORT
    output_contracts:
      report:
        - name: spec-review-summary.md
          format: summary
