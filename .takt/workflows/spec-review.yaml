name: spec-review
description: GrowMate docs/plans specification review against spec-review skill checklist and spec revision loop. A review cannot complete while in-scope client questions, implementation decisions, external inputs, or approval gates remain unresolved. Regenerates the spec's HTML visualization when the spec changed. Commits docs changes on the current branch only (no new branch, no push). Run before spec-to-pr.
workflow_config:
  provider_options:
    codex:
      network_access: true
max_steps: 12
initial_step: identify
loop_monitors:
  - cycle:
      - audit
      - revise
    threshold: 3
    judge:
      persona: supervisor
      knowledge:
        - growmate
      instruction: |
        audit -> revise のループが {cycle_count} 回繰り返されました。
        下記に全文添付された最新の audit 結果と修正内容を確認し、収束しているか判断してください。run ディレクトリやレポートパスの探索はしないでください。
        残件が「クライアント確認質問・実装判断・外部入力・承認ゲートへの回答待ち」のみの場合も、
        レビュー完了とはみなしません。`ABORT` し、確定内容を仕様書へ反映してから spec-review を再実行してください。

        ## spec-audit.md（最新・全文）
        {report:spec-audit.md}

        ## spec-revise-result.md（最新・全文）
        {report:spec-revise-result.md}
      rules:
        - condition: 収束済み（残件が対象スコープの質問・実装判断・外部入力・承認ゲート待ちのみ）
          next: ABORT
          appendix: |
            対象スコープの未解決事項が残っています。回答・確定内容を対象仕様書へ反映し、
            `spec-review` を再実行してください。未確定のまま `spec-to-pr` は実行しないでください。
        - condition: 健全（進捗あり）
          next: audit
        - condition: 非生産的（同じ指摘の反復・修正未反映）
          next: ABORT

steps:
  - name: identify
    tags:
      - plan
    edit: false
    persona: planner
    provider: claude-sdk
    knowledge:
      - growmate
    capabilities: readonly
    instruction: |
      レビュー対象の仕様書を特定し、適用する観点を決定してください。

      必須手順:
      1. ユーザー指示から対象仕様書（`docs/plans/` 配下）を特定する。曖昧な場合は `docs/plans/` を列挙し、候補を示して ABORT する。
      2. `.agents/skills/spec-review/SKILL.md` を読む。
      3. `docs/templates/requirement-definition.md` を要件定義チェックリストとして読む。
      4. 対象仕様書を読む。クライアント整合性・曖昧な要件・複数解釈・挙動変更・運用影響・未合意のトレードオフがある場合だけ `docs/context/client-vision-from-lark.md` を読む。純粋な技術仕様、DB・内部実装、または既存の正本で判断できるUI変更では読まない。
      5. spec-review skill のルーティング表に従い、対象仕様書に適用する条件付き観点（クライアント整合 / LLM / UI / データ / Google 連携 / 外部サービス連携）を判定し、対応する正本ファイルを列挙する。対象範囲（画面・機能・データ・API）と Non-goals（要件にない画面・UI・機能追加、ついで修正、将来対応）も確定する。
      6. 仕様書が対象とする機能の既存実装（`src/server/services/*`、`src/server/actions/*`、関連画面）を grep で把握する。
      7. 仕様書が外部サービス（Google / WordPress / Instagram(Meta) / Supabase 等）の API・挙動を前提にしている場合、`.agents/skills/spec-review/external-services.md` の「一次情報検証 > 公式ドキュメントの起点」の URL 表をもとに、audit で **実際に WebFetch して照合すべき公式ドキュメントの URL** を列挙する。仕様書のどの記述をどの URL で検証するかを対応付けて書く。外部サービス連携がない場合は「対象外」と明記する。
    rules:
      - condition: 対象仕様書と適用観点を確定した
        next: audit
      - condition: ユーザーが質問をしている（レビュータスクではない）
        next: COMPLETE
      - condition: 対象仕様書を特定できない
        next: ABORT
        appendix: |
          候補仕様書:
          - {候補1}
          - {候補2}
    output_contracts:
      report:
        - name: spec-review-scope.md
          format: plan

  - name: audit
    tags:
      - review
    edit: false
    persona: architecture-reviewer
    provider: claude-sdk
    knowledge:
      - architecture
      - growmate
    capabilities: readonly
    instruction: |
      `.agents/skills/spec-review/SKILL.md` を正本として、対象仕様書をレビューしてください。

      必須条件:
      - 共通観点 A（完全性）/ B（既存コード整合）/ C（非機能）/ D（セキュリティ）を全項目確認する。
      - `docs/templates/requirement-definition.md` の項目を使い、目的・成功指標、業務要件、対象範囲・Non-goals、機能要件、Gherkin受け入れ条件、非機能要件、データ・外部連携、制約・前提・依存関係、トレードオフ、リスク・未確定事項、テスト・リリース・ロールバック、承認状態の不足を確認する。
      - テンプレート項目が対象外の場合は、仕様書に対象外の理由があることを確認する。理由のない空欄は `needs_fix` とする。
      - 対象範囲と Non-goals を照合し、要件達成に直接必要でない画面・UI・機能・改善を仕様書へ混入させない。混入している場合は `needs_fix` とする。
      - 新規機能の既定対象ロールが `admin` / `paid` であることを確認する。`trial` / `unavailable` を含める例外は、理由と承認が仕様書に明記されていなければ `needs_fix` とする。
      - 認可条件、未認可時の利用者向け挙動、Server Action・Route Handler・APIなどサーバー側での認可強制が仕様書に明記されていることを確認する。
      - 下記添付の `spec-review-scope.md` で判定された条件付き観点の正本ファイルを読み、該当チェックリストを適用する。
      - B の確認では仕様書の記述を鵜呑みにせず、実コード（services / actions / components）を読んで再利用対象・乖離を検証する。
      - 外部サービス連携が対象の場合、下記添付の `spec-review-scope.md` で列挙した公式ドキュメント URL を **WebFetch で実際に取得し**、`.agents/skills/spec-review/external-services.md`「一次情報検証 > 検証必須項目」（エンドポイント / 必須パラメータ・フィールド名 / 権限スコープ / レート制限 / 非推奨告知 / 前提条件 / データ反映遅延）を照合する。記憶・過去の実装・ブログ記事・要約を根拠にしない。あわせて同ファイル「連携ライフサイクル（失効・剥奪・切断）」のチェックリストを適用する。
      - 公式ドキュメントを根拠にした指摘には、参照 URL・確認日（YYYY-MM-DD）・**公式ページ本文の verbatim 引用**を必ず添える。要約を経由した引用は禁止。公式に記述が見つからない挙動は断定せず確認質問に隔離する。
      - 外部サービス連携が対象の場合、`spec-audit.md` の冒頭に **「公式ドキュメント照合: 実施 / 未実施」** を必ず書く。実行中の provider に web 取得手段（WebFetch 等）が無く照合できない場合は「未実施（provider に web 取得手段なし）」と明記し、記憶や既存実装で代替して照合したことにしない。
      - WebFetch が失敗した URL は「未確認」として `spec-audit.md` に残し、レビュー自体は止めずに他の観点を続行する。
      - 指摘は「問題箇所 / なぜ危険か / 修正案」の形式で、重大度（🔴/🟡/🟢）を付ける。
      - クライアント確認が必要な論点は修正案を断定せず、確認質問（Pre-implementation Questions 形式）として隔離する。
      - ステータス、ゲート表、未確定事項、確認質問、レビュー記録を突合し、対象スコープに関係する「未回答 / 未確定 / 合意待ち / 受領待ち / 見積待ち」の項目を抽出する。過去に解消済みの項目、対象外フェーズの項目、単なるリスク記録は未解決として数えない。
      - 判定基準: 🔴 がゼロ、対象スコープの未解決質問・意思決定・外部入力・承認ゲートがゼロ、かつ 🟡 が修正済みまたは理由付きで残置合意済み（仕様書の「レビュー記録」セクションに理由が記録されている）なら approved。エージェントが解消できる 🔴/🟡 があれば needs_fix。対象スコープの未解決事項が1件でも残る場合は `approved_with_questions` と記録してよいが、レビュー完了にはせず ABORT する。

      ## spec-review-scope.md（全文）
      {report:spec-review-scope.md}
    rules:
      # architecture-review 形式の `spec-audit.md` は冒頭を「## 結果: APPROVE / REJECT」と書く。
      # SKILL.md の判定語彙（approved / approved_with_questions / needs_fix）と表記が異なり、
      # judge が no rule matched で落ちる実測があるため両方の語彙を条件に含める。
      - condition: approved / APPROVE（自己解消可能な指摘なし・確認質問もなし）
        next: visualize
      - condition: approved_with_questions / APPROVE（対象スコープに未回答質問・未確定の実装判断・外部入力・承認ゲートが残っている。レビュー未完了）
        next: ABORT
        appendix: |
          対象スコープの未解決事項が残っています。回答・確定内容を対象仕様書へ反映し、
          `spec-review` を再実行してください。未確定のまま `spec-to-pr` は実行しないでください。
      - condition: "needs_fix / REJECT（仕様書修正で解消できる指摘がある。spec-audit.md の見出しが REJECT なら原則これ）"
        next: revise
    output_contracts:
      report:
        - name: spec-audit.md
          format: architecture-review

  - name: revise
    tags:
      - implementation
    edit: true
    persona: coder
    provider: claude-sdk
    knowledge:
      - growmate
    provider_options:
      extends: edit
    required_permission_mode: edit
    pass_previous_response: false
    instruction: |
      下記に全文添付された `spec-audit.md` を一次情報として、対象仕様書の未解決指摘だけを修正してください。

      必須条件:
      - 編集対象は `docs/` 配下の対象仕様書（および付随する docs）に限定する。プロダクションコード・設定ファイルは一切編集しない。
      - クライアント確認が必要な論点は本文を勝手に確定させず、仕様書内に「未確定事項（クライアント確認中）」セクションとして質問ごと明記する。未解決の実装判断・外部入力・承認ゲートも同様に確定前の状態を明記する。対象スコープに未解決事項が残る場合、audit は `approved_with_questions` を出してもレビュー完了にはせず ABORT する。
      - 理由付きで残置合意とする 🟡 論点は、仕様書内の「レビュー記録」セクションに理由付きで記録する。`spec-audit.md` 冒頭に「公式ドキュメント照合: 未実施」とある場合はその旨も同セクションに記録する（audit の再実行と後続の spec-to-pr workflow はこのセクションを正本として参照する）。
      - 外部サービスの公式ドキュメントを根拠に本文を直す場合、仕様書に参照 URL・確認日（YYYY-MM-DD）・公式ページ本文の verbatim 引用を残す。引用と、そこから導いた解釈は分けて書く。裏取りが必要なのに `spec-audit.md` に URL・引用がない指摘は、自分で WebFetch して確認してから直す。
      - 指摘への対応方針が複数あり判断できない場合は、勝手に選ばず ABORT する。
      - 修正した指摘と、対応しなかった指摘（理由付き）を報告する。
    rules:
      - condition: 指摘を修正した
        next: audit
      - condition: 修正方針を判断できない、情報不足
        next: ABORT
    output_contracts:
      report:
        - name: spec-revise-result.md
          format: coder-decisions

  - name: visualize
    tags:
      - implementation
    edit: true
    persona: coder
    knowledge:
      - growmate
    provider_options:
      extends: edit
    required_permission_mode: edit
    instruction: |
      `.agents/skills/spec-to-html/SKILL.md` を正本として、対象仕様書の図解 HTML を最新化してください。

      最初に実行要否を判定する:
      1. `git status --porcelain docs/plans/` と `git diff --stat HEAD -- docs/plans/` で、本ランで対象仕様書が変更されたかを確認する。
      2. `docs/plans/_html/<slug>/core.yaml` の有無を確認する（`<slug>` は対象仕様書のファイル名から `.md` を除いたもの）。
      3. **対象仕様書が未変更、かつ `docs/plans/_html/<slug>.html` が既に存在する**場合は、生成を行わずスキップした旨だけ報告して次に進む。

      実行する場合:
      - 再構成ビュー（01 ステータス / 02 設計判断 / 03 クイズ）: `core.yaml` が既にあるなら **更新モード**。仕様書の差分に対応する `concepts` / `relations` / `risks` / `questions` だけを直し、id は安定させる。全書き直しはしない。`core.yaml` が無いなら **新規モード**で SKILL.md の手順に従って起案する。
      - 全文ビュー（04）: **手で書かず** `python3 scripts/spec-html.py fulltext --spec <対象仕様書> --out docs/plans/_html/<slug>/views/04-fulltext.html` で機械変換する。仕様書が変わっていれば必ず再生成する。
      - 結合は必ず `python3 scripts/spec-html.py build` に4ビューすべてと `--source <対象仕様書>` を渡して行う。安全検査で落ちた場合は違反箇所を直して再実行する。
      - **`build` の整合性チェック出力を必ず読む。** `[fail]` が出た場合は `core.yaml` の `source_refs` の行番号が仕様書の改訂に追従できていない。`.agents/skills/spec-to-html/maintenance.md` の「更新モードで fail が出たときの手順」に従って該当参照を貼り直し、その参照を根拠にした concept の記述を見直したうえで `build` を再実行し、fail が消えるまで繰り返す（最大3回まで。消えなければ残る fail を報告して次に進む）。
      - 生成結果を headless Chrome の `--dump-dom` で確認し、パネル数が 4、`hidden` が 3 であることを検証する。

      必須条件:
      - 編集対象は `docs/plans/_html/` 配下に限定する。仕様書本文・プロダクションコード・設定ファイルは一切編集しない。
      - `docs/plans/_html/` は `.gitignore` 済みのため commit しない。commit は次の finalize の責務。
      - 図解生成に失敗しても ABORT しない。レビュー結果の commit を妨げないよう、失敗理由を報告して finalize に進む。
    rules:
      - condition: 図解を更新した、または対象外としてスキップした
        next: finalize
      - condition: 図解の生成に失敗した（理由を報告し、レビュー結果の commit は妨げない）
        next: finalize
    output_contracts:
      report:
        - name: spec-visualize-result.md
          format: coder-decisions

  - name: finalize
    tags:
      - coding
      - report
    edit: true
    persona: coder
    provider: cursor
    model: gpt-5.6-luna-high
    knowledge:
      - growmate
    required_permission_mode: edit
    allow_git_commit: true
    instruction: |
      レビュー結果を確定し、仕様書に変更がある場合は現在のブランチに commit してください。新しいブランチの作成・push・PR 操作は行わないでください。

      手順:
      1. `git status` / `git diff` で変更内容を確認する。`docs/` 以外の dirty があっても ABORT しない。それらはステージせず、最終レポートに「作業ツリーに残した未コミット変更」としてパスを列挙する。
      2. 仕様書に変更がある場合: 本ランで直した `docs/` 配下だけを `git add` する（対象仕様書と、revise が直した付随 docs。判断できなければ対象仕様書だけ）。`docs/plans/_html/` は `.gitignore` 済みなので add しない。現在のブランチのまま、日本語1行メッセージで commit する。ブランチ作成（`git checkout -b` / `git switch -c` 等）と `git push` は行わない。
      3. 仕様書に変更がない場合（指摘なし approved）: commit は行わない。他の dirty の有無は問わない。
      4. 最終レポートに以下を含める: 指摘サマリ（重大度別件数）、未解決のクライアント確認質問、公式ドキュメント照合の実施可否（下記添付の `spec-audit.md` 冒頭の記載を転記。未実施ならその理由）と照合した URL・確認日（未確認のまま残った URL があれば明記）、図解 HTML の更新有無とパス（`docs/plans/_html/<slug>.html`。commit 対象外）、作業ツリーに残した未コミット変更（なければ「なし」）、次アクション（質問回答 → 必要なら人間が push/PR → `.takt/workflows/spec-to-pr.yaml` で実装）。

      やらないこと:
      - 新しいブランチの作成・切り替え。
      - `git push`（`-u` 含む）。
      - PR の作成・更新・マージ・クローズ（`gh pr create` / `gh pr edit` / `gh pr comment` 含む）。
      - `docs/` 以外の編集・ステージ・コミット。
      - `docs/` 以外が dirty であることだけを理由にした ABORT。

      ## spec-audit.md（最新・全文）
      {report:spec-audit.md}
    rules:
      - condition: レビュー確定（commit 完了、または変更なしで完了）
        next: COMPLETE
      - condition: docs/ の commit に失敗した、または docs/ 以外をステージ・コミットした
        next: ABORT
    output_contracts:
      report:
        - name: spec-review-summary.md
          format: summary
