name: grill-to-gherkin
description: >-
  要件を対話で明確化し、既存実装の再利用・拡張候補を提案したうえで、
  Gherkinと概算の着手判断を人間承認で確定してから仕様書・コード編集前に止める前段 workflow
max_steps: 20
initial_step: grill

steps:
  - name: grill
    tags:
      - plan
      - grill-readonly
    edit: false
    persona: planner
    policy:
      - grill-to-gherkin-exploration-boundary
    knowledge:
      - growmate
    capabilities: readonly
    instruction: grill-to-gherkin/grill
    output_contracts:
      report:
        - name: 01-grill.md
          format: grill-to-gherkin/result
          use_judge: false
    rules:
      - condition: 要件が明確になり、Gherkin化可能
        next: gherkin
      - condition: 要件を確定できない
        next: ABORT
        appendix: |
          要件を確定できませんでした。標準 `grill-me` で不足する判断事項を確認してから再実行してください。

  - name: gherkin
    tags:
      - plan
      - grill-readonly
    edit: false
    persona: planner
    policy:
      - grill-to-gherkin-exploration-boundary
    knowledge:
      - growmate
    capabilities: readonly
    instruction: grill-to-gherkin/gherkin
    output_contracts:
      report:
        - name: 02-gherkin.md
          format: grill-to-gherkin/gherkin
          use_judge: false
    rules:
      - condition: 追加確認が必要
        next: ABORT
        appendix: |
          Gherkinの追加確認が必要です。`takt -w grill-to-gherkin -t "不足している要件を確認してください"` を再実行し、標準 `grill-me` で判断事項を確定してください。
      - condition: Gherkin化が完了
        next: confirm
      - condition: Gherkin化できない
        next: ABORT
        appendix: |
          Gherkinを安全に確定できませんでした。`02-gherkin.md` の未確定事項を確認してください。

  - name: confirm
    tags:
      - review
      - grill-readonly
    edit: false
    persona: supervisor
    policy:
      - grill-to-gherkin-exploration-boundary
    knowledge:
      - growmate
    capabilities: readonly
    instruction: grill-to-gherkin/confirm
    output_contracts:
      report:
        - name: 03-confirmation.md
          format: grill-to-gherkin/confirmation
          use_judge: false
    rules:
      - condition: ユーザー承認済み
        next: rough_estimate
      - condition: 修正が必要
        next: gherkin
      - condition: ユーザー確認が必要
        next: confirm
        requires_user_input: true
        interactive_only: true
        appendix: |
          Gherkinの人間承認が必要です。`takt` の対話モードで承認または修正指示を入力してください。
      - condition: ユーザー確認が必要
        next: ABORT
        appendix: |
          Gherkinの人間承認が必要です。`takt` の対話モードで承認または修正指示を入力してください。
      - condition: 承認判定を完了できない
        next: ABORT
        appendix: |
          Gherkinの承認判定を完了できませんでした。`03-confirmation.md` を確認してください。

  - name: rough_estimate
    tags:
      - plan
      - report
      - grill-readonly
    edit: false
    persona: planner
    policy:
      - grill-to-gherkin-exploration-boundary
    knowledge:
      - growmate
    capabilities: readonly
    instruction: grill-to-gherkin/rough-estimate
    output_contracts:
      report:
        - name: 05-rough-estimate.md
          format: grill-to-gherkin/rough-estimate
          use_judge: false
    rules:
      - condition: 概算工数を作成
        next: estimate_confirm
      - condition: 概算工数は算出不能
        next: estimate_confirm

  - name: estimate_confirm
    tags:
      - review
      - grill-readonly
    edit: false
    persona: supervisor
    policy:
      - grill-to-gherkin-exploration-boundary
    knowledge:
      - growmate
    capabilities: readonly
    instruction: grill-to-gherkin/estimate-confirm
    output_contracts:
      report:
        - name: 06-estimate-confirmation.md
          format: grill-to-gherkin/estimate-confirmation
          use_judge: false
    rules:
      - condition: 着手承認
        next: handoff
      - condition: 要件再確認が必要
        next: ABORT
        appendix: |
          要件または概算前提の再確認が必要です。`takt -w grill-to-gherkin -t "要件または概算前提を再確認してください"` を再実行し、標準 `grill-me` で見直してください。
      - condition: 見送り
        next: COMPLETE
      - condition: ユーザー確認が必要
        next: estimate_confirm
        requires_user_input: true
        interactive_only: true
        appendix: |
          概算工数に対する着手判断が必要です。`着手承認`、`要件再確認が必要`、または`見送り`を入力してください。

  - name: handoff
    tags:
      - report
      - grill-readonly
    edit: false
    persona: planner
    policy:
      - grill-to-gherkin-exploration-boundary
    knowledge:
      - growmate
    capabilities: readonly
    instruction: grill-to-gherkin/handoff
    output_contracts:
      report:
        - name: 04-handoff.md
          format: grill-to-gherkin/handoff
          use_judge: false
    rules:
      - condition: 引き継ぎ情報を作成
        next: COMPLETE
      - condition: 引き継ぎ先を確定できない
        next: grill
      - condition: 引き継ぎ情報を作成できない
        next: ABORT
        appendix: |
          対象仕様書パスまたは承認済み Gherkin が不足しています。`01-grill.md` から確認してください。
