name: spec-to-pr
description: GrowMate docs/plans specification to implementation, quality gates, architecture review loop, commit, PR creation with review summary body, and a single post-PR review-comment triage (5 minutes after create_pr) whose outcome is recorded on the PR as one comment. MVP scope and requirements traceability are enforced via workflows/rules/mvp-scope.md; minimal-impl ladder via workflows/rules/minimal-impl-ladder.md and code comment rules via workflows/rules/code-comments.md (all_steps.rules). Reviewers attach previous reviews + fix-result for follow-up (finding_id / persists); unfixable residuals exit via cannot_fix rather than endless fix loops.
all_steps:
  rules:
    - ref: mvp-scope
      position: before_instruction
    - ref: minimal-impl-ladder
      position: before_instruction
    - ref: code-comments
      position: before_instruction
workflow_config:
  # ローカル TAKT 用の認証 fail-fast。相対パスは cwd（リポジトリ根）基準。
  # Cloud 無人の主系は .agents/skills/cloud-agent-unattended（takt を起動しない）。
  runtime:
    prepare:
      - scripts/takt-check-provider-auth.sh
# seed 1 + happy path 13 + レビュー往復 5×2 + self_review 往復 3×2+1 + final gate 往復 4×2+1 = 40、根拠の無い承認のやり直し分で 45。
# 実行時間の上限は TAKT に run 全体のキーが無いため scripts/takt-overnight.sh が持つ。
max_steps: 45
initial_step: seed_reports
loop_monitors:
  # ui_evidence を cycle に入れるのは、続行時に証跡を撮り直さず reviewers へ進ませないため
  - cycle:
      - ui_evidence
      - reviewers
      - review
      - fix
    # judge が続行を返すと検出の履歴が消え、2 では3回目の差し戻しまで止まらない。回数は review-history.md で数える
    threshold: 1
    judge:
      persona: supervisor
      instruction: |
        ui_evidence → reviewers → review → fix の1周が終わりました。次の周（UI 証跡の撮り直しから）へ進むか、ここで止めるかを判定してください。

        判定の根拠の規則（満たさない判定は無効）:
        - fix-result.md で「直った」とされる finding_id は、指摘箇所の実コードと、関係するテストのファイルを Read で開いて確かめる。報告の記載だけで直ったとみなさない。
        - 「未解決」と判定する finding_id には、失敗しているテスト名とコマンド出力（`.takt/quality-gates/logs/` のログの該当行）、またはテストが無い指摘なら `path:行番号` を書く。どちらも書けない指摘は未解決に数えない。
        - review-history.md で、同じ finding_id が2回とも未解決（new / persists / reopened）だったかを数える。直ったとされたのに実コードで直っていない finding_id は、その回も未解決として数える。

        2回差し戻した finding_id が1件でもあれば止める。止めるときは、finding_id ごとに「何が足りないか（仕様の欠落・判断材料・手で確かめるべきこと）」を書く。
        run ディレクトリやレポートパスの探索はしない（必要なレポートは下に全文添付してある）。

        ## review-history.md（最新・全文）
        {report:review-history.md}

        ## review-gate.md（最新・全文）
        {report:review-gate.md}

        ## fix-result.md（最新・全文）
        {report:fix-result.md}
      rules:
        - condition: 2回差し戻した finding_id は無い
          next: ui_evidence
        - condition: 同じ finding_id を2回差し戻した
          next: ABORT
          appendix: |
            同じ指摘の差し戻しが2回続いたため、3周目に入らず止めました。人間が次を判断してください。
            - {finding_id}: {何が足りないか。仕様の欠落・判断材料・手で確かめるべきこと}
  # reviewers をやり直しても根拠が出てこないため、根拠の無い承認が2回続いたら止める
  - cycle:
      - reviewers
      - review
    threshold: 2
    judge:
      persona: supervisor
      instruction: |
        レビュアーの承認が、読んだファイル:行番号の根拠を欠いたまま {cycle_count} 回続きました。承認として扱えないので止めます。
        どのレビュアーの承認に何が欠けていたかを、下の review-gate.md から書き出してください。

        ## review-gate.md（最新・全文）
        {report:review-gate.md}
      rules:
        - condition: 根拠の無い承認が続いたので止める
          next: ABORT
          appendix: |
            レビュアーの承認に、読んだファイル:行番号の根拠がありませんでした。
            - {レビュアー}: {欠けていた根拠}
  - cycle:
      - self_review
      - self_review_fix
      - ui_evidence_recheck
    threshold: 2
    judge:
      persona: supervisor
      instruction: |
        self_review -> self_review_fix -> ui_evidence_recheck のループが {cycle_count} 回繰り返されました。final gate へ進めるか、ここで止めるかを判定してください。

        判定の根拠の規則（満たさない判定は無効）:
        - fix-result.md で「直った」とされる ID は、指摘箇所の実コードと関係するテストを Read で開いて確かめる。
        - 「未解決」と判定する ID には、失敗しているテスト名とコマンド出力（`.takt/quality-gates/logs/` のログの該当行）、またはテストが無い指摘なら `path:行番号` を書く。

        fix-result が追加修正不能（`cannot_fix`）と記録した残件、および「手動ブラウザ確認未実施」または管理者作業（マイグレーション適用・型再生成・pendingファイル削除）のみの場合は、追加修正で解消不能な残件として final gate に進める。
        同じ ID を2回差し戻した場合は止める。run ディレクトリやレポートパスの探索はしない。
        注: readme_sync はこのループに含めない（reviewers 承認後の1回のみ。self_review_fix 後に README 判定へ戻さない）。

        ## self-review.md（最新・全文）
        {report:self-review.md}

        ## fix-result.md（最新・全文）
        {report:fix-result.md}

        ## readme-sync.md（参考・初回のみ。欠落文なら無視）
        {report:readme-sync.md}
      rules:
        - condition: 収束済み（残件が手動確認・管理者作業のみ、または指摘なし）
          next: final_gate
        - condition: 同じ ID を2回差し戻した、または直ったとされる項目が実コードで直っていない
          next: ABORT
          appendix: |
            セルフレビューの同じ指摘の差し戻しが2回続いたため止めました。人間が次を判断してください。
            - {ID}: {何が足りないか}
  - cycle:
      - self_review_fix
      - ui_evidence_recheck
      - self_review
      - final_gate
    threshold: 2
    judge:
      persona: supervisor
      instruction: |
        final gate の REJECT から self_review_fix → ui_evidence_recheck → self_review → final gate のループが {cycle_count} 回繰り返されました。
        review-resolution.md の未解消の問題 ID が2回とも残っていれば止めます。直ったとされる問題は実コードを Read で開いて確かめ、未解消と判定する問題には `path:行番号` を書いてください。

        ## review-resolution.md（最新・全文）
        {report:review-resolution.md}

        ## fix-result.md（最新・全文）
        {report:fix-result.md}
      rules:
        - condition: 2回とも残った問題 ID は無く、解消が進んでいる
          next: self_review_fix
        - condition: 同じ問題 ID が2回とも残った
          next: ABORT
          appendix: |
            final gate の同じ指摘が2回続いたため止めました。人間が次を判断してください。
            - {問題ID}: {何が足りないか}

steps:
  # TAKT 0.71 の doctor は全経路で先に作られたレポートしか参照を認めないため、前の周のレポートを読む step 用に
  # 欠落文と同じ1行で先に作る。再入り口に置くと本物の記録を上書きするため initial_step 専用。
  - name: seed_reports
    tags:
      - report
    edit: false
    persona: reporter
    capabilities: growmate-readonly
    pass_previous_response: false
    instruction: |
      このステップは調べ物も編集もしません。後段のレポートの初期状態を用意するだけです。応答は「初期化した」の1行にしてください。
    rules:
      - condition: when(true)
        next: plan
    output_contracts:
      report:
        - name: fix-result.md
          use_judge: false
          order: &seed-order |
            下の format の1行だけを、そのまま書く。見出し・説明・コードブロック・空行を足さない。
          format: "（参照先の報告 fix-result.md はこの run に存在しない）"
        - name: ai-antipattern-review.md
          use_judge: false
          order: *seed-order
          format: "（参照先の報告 ai-antipattern-review.md はこの run に存在しない）"
        - name: architecture-review.md
          use_judge: false
          order: *seed-order
          format: "（参照先の報告 architecture-review.md はこの run に存在しない）"
        - name: frontend-review.md
          use_judge: false
          order: *seed-order
          format: "（参照先の報告 frontend-review.md はこの run に存在しない）"
        - name: review-history.md
          use_judge: false
          order: *seed-order
          format: "（参照先の報告 review-history.md はこの run に存在しない）"
        - name: review-resolution.md
          use_judge: false
          order: *seed-order
          format: "（参照先の報告 review-resolution.md はこの run に存在しない）"
        - name: pr-comment-fix-result.md
          use_judge: false
          order: *seed-order
          format: "（参照先の報告 pr-comment-fix-result.md はこの run に存在しない）"

  - name: plan
    tags:
      - plan
    edit: false
    persona: planner
    knowledge:
      - architecture
      - growmate
    capabilities: growmate-readonly
    instruction: spec-to-pr/plan
    rules:
      - condition: 実装前提を満たし実装可能（ステータス approved/implemented、UIゲート充足、spec-review 未解決なし）
        next: implement
      - condition: ユーザーが質問をしている（実装タスクではない）
        next: COMPLETE
      - condition: 実装前提を満たさない（ステータス不正、UIゲート未承認、spec-review 未解決、情報不足）
        next: ABORT
        appendix: |
          仕様書の修正、または UI たたき台の承認が必要です。次を確認してください。
          - メタデータ `- ステータス:` が `approved` または `implemented` であること（`draft` / `review` / 欠損は不可。レビュー本文の表記では代用しない）
          - UI 実装がある場合のみ: 仕様の UIたたき台／UIモック実装前ゲート（例: CP-2）が承認済みであること。未確認なら図解 HTML の UIモックタブを PO に見せて閉じてから再実行する。**UI が対象外でゲート自体が無い場合は不要**
          - ゲートがあるのに `docs/plans/_html/<slug>/views/06-ui-mock.html`（または結合 HTML の UIモックタブ）が無い場合は、先に `spec-to-html` で追加する
          - 未回答の質問・実装判断・外部入力・承認ゲートがある場合は、回答と確定した仕様を対象仕様書へ反映すること
          上記を満たすため必要なら `.takt/workflows/spec-review.yaml` を先に再実行してください（finalize がステータスを `approved` へ更新する）。
          ゲートとメタデータが揃った後、この workflow を再実行してください。
          - {質問1}
          - {質問2}
    output_contracts:
      report:
        - name: plan.md
          format: spec-to-pr/plan

  - name: implement
    tags:
      - coding
      - implementation
    edit: true
    persona: coder
    policy:
      - coding
    knowledge:
      - growmate
    capabilities: growmate-edit
    required_permission_mode: edit
    instruction: spec-to-pr/implement
    quality_gates:
      - type: command
        name: npm-verify
        # takt の command gate は出力64KB超でプロセスを kill し失敗扱いにする（commandGateRunner の固定値）。
        # verify はテストの stderr だけで超えるため、全文はファイルへ逃がし、失敗時だけ末尾を出す。終了コードは verify のまま。
        command: mkdir -p .takt/quality-gates/logs && npm run verify > .takt/quality-gates/logs/npm-verify-last.log 2>&1 || { tail -c 40000 .takt/quality-gates/logs/npm-verify-last.log; exit 1; }
        cwd: .
        timeout_ms: 900000
    rules:
      - condition: 実装と必須検証（npm run verify）が完了した
        next: ui_evidence
      # 完了契約の「未完了」行（テスト・観測記録の不足）は仕様の問題ではなく reviewers → fix で閉じる。
      # この行が無いと判定が下の ABORT を選び、resume しても同じ所で止まり続ける。
      - condition: npm run verify は成功したが、実装レポートの完了契約に「未完了」の行が残っている（テスト不足・観測記録不足など、仕様書の修正を要しない残件）
        next: ui_evidence
      - condition: 対象仕様書が plan.md 作成後に変更されており、実装方針の再検討が必要
        next: plan
        command_gates: skip
      - condition: 判断できない、情報不足（仕様書の矛盾・欠落があり、仕様書を直さないと実装を進められない）
        next: ABORT
        command_gates: skip
    output_contracts:
      report:
        - name: coder-scope.md
          format: coder-scope
        - name: coder-decisions.md
          format: coder-decisions
        - name: implement-report.md
          format: implementation-report
  - name: ui_evidence
    uses: ui-evidence
    rules:
      - condition: when(structured.ui_evidence.verdict == "captured")
        next: reviewers
      - condition: when(structured.ui_evidence.verdict == "not_applicable")
        next: reviewers
      - condition: when(structured.ui_evidence.verdict == "cannot_capture")
        next: ABORT
        appendix: |
          UI 変更があるのに画面の証跡を採取できませんでした（scripts/takt-ui-evidence.ts が終了コード3）。
          夜通し実行の前に docs/runbooks/takt-overnight-preflight.md の手順（.env.local・ログイン状態の storageState・Chromium）を確認してから再実行してください。

  # parallel の子は structured_output を持てないため、承認の判定は直後の review が集約する
  - name: reviewers
    parallel:
      fixed:
        - name: ai_antipattern_review
          session_key: ai-antipattern-review
          tags:
            - review
          edit: false
          persona: ai-antipattern-reviewer
          policy:
            - review
            - ai-antipattern
          knowledge:
            - growmate
          capabilities: growmate-readonly
          instruction:
            - ai-antipattern-review
            - spec-to-pr/review-follow-up
          rules:
            - condition: approved
            - condition: needs_fix
          output_contracts:
            report:
              - name: ai-antipattern-review.md
                format: ai-antipattern-review
        - name: architecture_review
          session_key: architecture-review
          tags:
            - review
          edit: false
          persona: architecture-reviewer
          knowledge:
            - architecture
            - growmate
          capabilities: growmate-readonly
          instruction:
            - spec-to-pr/architecture-review
            - spec-to-pr/review-follow-up
          rules:
            - condition: approved
            - condition: needs_fix
          output_contracts:
            report:
              - name: architecture-review.md
                format: architecture-review
      pool:
        - name: frontend_review
          description: plan.md の UIモック が対象外でない、または app/ か src/components/ の画面・部品を変更したときに選ぶ。それ以外（サーバー処理・DB・docs だけの変更）では選ばない。
          session_key: frontend-review
          tags:
            - review
          edit: false
          persona: frontend-reviewer
          policy:
            - frontend
            - react
            - review
            - design-fidelity
          knowledge:
            - frontend
            - react
            - growmate
          capabilities: growmate-readonly
          instruction:
            - frontend-review
            - spec-to-pr/frontend-review
            - spec-to-pr/review-follow-up
          rules:
            - condition: approved
            - condition: needs_fix
          output_contracts:
            report:
              - name: frontend-review.md
                format: frontend-review
      # 一度選んだ frontend_review は以降の回も走らせる（外れた回に前回の frontend-review.md を今回分として読ませない）
      selection:
        mode: cumulative
        selector:
          instruction: select-applicable-candidates
    rules:
      - condition: all("approved")
        next: review
      - condition: any("needs_fix")
        next: review

  # 承認なしで PR に届く経路を作らないため、loop judge の脱出口も readme_sync へ直結させない
  - name: review
    tags:
      - review
    edit: false
    persona: supervisor
    session_key: review-gate
    session: refresh
    knowledge:
      - growmate
    capabilities: growmate-readonly
    pass_previous_response: false
    instruction: spec-to-pr/review-gate
    structured_output:
      schema_ref: review_gate
    rules:
      - condition: when(structured.review.approved == true && structured.review.verdict == "approved")
        next: readme_sync
      - condition: when(structured.review.verdict == "needs_fix")
        next: fix
      - condition: when(structured.review.verdict == "invalid_approval")
        next: reviewers
    output_contracts:
      report:
        - name: review-gate.md
          format: |
            # レビュー承認の判定
            - approved: true / false
            - verdict: approved / needs_fix / invalid_approval
            ## レビュアーごとの判定
            | レビュアー | 判定 | 根拠（読んだファイル:行番号） | 有効 / 無効 |
            ## 未解決の finding_id
            | finding_id | レビュアー | 根拠（path:行番号 / 失敗テスト名とコマンド出力） |
        # 過去の回の記録。判定は今回の review-gate.md だけで行う
        - name: review-history.md
          use_judge: false
          format: |
            # レビュー履歴
            | finding_id | レビュアー | 1回目 | 2回目 | … | 差し戻し回数 |

  - name: fix
    tags:
      - coding
      - implementation
    edit: true
    persona: coder
    policy:
      - coding
    knowledge:
      - growmate
    capabilities: growmate-edit
    required_permission_mode: edit
    pass_previous_response: false
    instruction: spec-to-pr/fix
    # プロダクション影響パスがあるときだけフル verify（docs/README 等のみはスキップ）
    quality_gates:
      - type: command
        name: npm-verify-changed
        # 出力64KB上限の回避は implement の npm-verify と同じ理由
        command: mkdir -p .takt/quality-gates/logs && npm run verify:changed > .takt/quality-gates/logs/npm-verify-changed-last.log 2>&1 || { tail -c 40000 .takt/quality-gates/logs/npm-verify-changed-last.log; exit 1; }
        cwd: .
        timeout_ms: 900000
    structured_output:
      schema_ref: fix
    rules:
      - condition: when(structured.fix.verdict == "fixed")
        next: ui_evidence
      - condition: when(structured.fix.verdict == "info_missing")
        next: plan
        command_gates: skip
      - condition: when(structured.fix.verdict == "spec_changed")
        next: plan
        command_gates: skip
      - condition: when(structured.fix.verdict == "stuck")
        next: ABORT
        command_gates: skip
    output_contracts:
      report:
        - name: fix-result.md
          format: coder-decisions
        - name: fix-report.md
          format: implementation-report

  - name: self_review_fix
    tags:
      - coding
      - implementation
    edit: true
    persona: coder
    policy:
      - coding
    knowledge:
      - growmate
    capabilities: growmate-edit
    required_permission_mode: edit
    pass_previous_response: false
    instruction: spec-to-pr/self-review-fix
    # プロダクション影響パスがあるときだけフル verify（docs/README 等のみはスキップ）
    quality_gates:
      - type: command
        name: npm-verify-changed
        # 出力64KB上限の回避は implement の npm-verify と同じ理由
        command: mkdir -p .takt/quality-gates/logs && npm run verify:changed > .takt/quality-gates/logs/npm-verify-changed-last.log 2>&1 || { tail -c 40000 .takt/quality-gates/logs/npm-verify-changed-last.log; exit 1; }
        cwd: .
        timeout_ms: 900000
    structured_output:
      schema_ref: self_review_fix
    rules:
      # readme_sync は reviewers 承認後の1回のみ。ここへ戻さない（空回り防止）
      - condition: when(structured.self_review_fix.verdict == "fixed")
        next: ui_evidence_recheck
      - condition: when(structured.self_review_fix.verdict == "arch_impact")
        next: ui_evidence
        command_gates: skip
      - condition: when(structured.self_review_fix.verdict == "info_missing")
        next: plan
        command_gates: skip
      - condition: when(structured.self_review_fix.verdict == "stuck")
        next: ABORT
        command_gates: skip
    output_contracts:
      report:
        - name: fix-result.md
          format: coder-decisions
        - name: self-review-fix-report.md
          format: implementation-report

  - name: ui_evidence_recheck
    uses: ui-evidence
    rules:
      - condition: when(structured.ui_evidence_recheck.verdict == "captured")
        next: self_review
      - condition: when(structured.ui_evidence_recheck.verdict == "not_applicable")
        next: self_review
      - condition: when(structured.ui_evidence_recheck.verdict == "cannot_capture")
        next: ABORT
        appendix: |
          UI 変更があるのに画面の証跡を採取できませんでした（scripts/takt-ui-evidence.ts が終了コード3）。
          夜通し実行の前に docs/runbooks/takt-overnight-preflight.md の手順（.env.local・ログイン状態の storageState・Chromium）を確認してから再実行してください。

  - name: readme_sync
    tags:
      - coding
      - documentation
    edit: true
    persona: coder
    policy:
      - coding
    knowledge:
      - growmate
    capabilities: growmate-edit
    required_permission_mode: edit
    instruction: spec-to-pr/readme-sync
    structured_output:
      schema_ref: readme_sync
    rules:
      - condition: when(structured.readme_sync.verdict == "done")
        next: self_review
      - condition: when(structured.readme_sync.verdict == "cannot_judge")
        next: ABORT
    output_contracts:
      report:
        - name: readme-sync.md
          format: coder-decisions

  - name: self_review
    tags:
      - review
    edit: false
    persona: supervisor
    session_key: self-review
    knowledge:
      - growmate
    capabilities: growmate-readonly
    instruction: spec-to-pr/self-review
    structured_output:
      schema_ref: self_review
    rules:
      - condition: when(structured.self_review.verdict == "pass")
        next: final_gate
      - condition: when(structured.self_review.verdict == "needs_fix")
        next: self_review_fix
      - condition: when(structured.self_review.verdict == "cannot_verify")
        next: ABORT
    output_contracts:
      report:
        - name: self-review.md
          format: spec-to-pr/self-review
  - name: final_gate
    uses: peer-review-final-gate
    session_key: final-gate
    session: refresh
    capabilities: growmate-readonly
    with:
      review_knowledge:
        - architecture
        - growmate
      final_gate_policy:
        - review
      final_gate_instruction: spec-to-pr/final-gate
    rules:
      - condition: APPROVE && when(structured.review.approved == true && structured.review.verdict == "approved")
        next: prepare_pr_summary
      # 同じ意味ラベルの rule は appendix を揃える必要があるため、承認なしの停止理由は書けない
      - condition: APPROVE
        next: ABORT
      - condition: REJECT
        next: self_review_fix
      - condition: BLOCKED
        next: ABORT
        appendix: |
          final gate が、現在のコードと前段の報告だけでは要件充足を判定できませんでした。
          - {判定できない要件}: {必要な外部判断または情報}

  - name: prepare_pr_summary
    tags:
      - report
    edit: false
    persona: reporter
    knowledge:
      - growmate
    capabilities: growmate-readonly
    instruction: spec-to-pr/pr-summary
    rules:
      - condition: PR 本文正本（pr-summary.md）が完了した && when(structured.review.approved == true && structured.review.verdict == "approved")
        next: create_pr
      # レビュー承認が無いまま push / PR 作成へ進ませない
      - condition: PR 本文正本（pr-summary.md）が完了した
        next: ABORT
      - condition: 添付レポートの内容が欠落・破損しており、レビュー結果を確認できない
        next: ABORT
    output_contracts:
      report:
        - name: pr-summary.md
          format: spec-to-pr/pr-summary

  - name: create_pr
    tags:
      - coding
    edit: true
    persona: coder
    knowledge:
      - growmate
    capabilities: growmate-edit
    required_permission_mode: edit
    allow_git_commit: true
    instruction: spec-to-pr/create-pr
    rules:
      - condition: コミット・push・PR 作成または更新が完了した（create 失敗後の re-list → edit 成功、既存 PR 追記を含む）
        next: watch_pr_comments
      - condition: コミット、push、または PR 作成/更新に失敗した（re-list → edit でも回復できない場合）
        next: ABORT

  # create_pr の 5 分後（delay_before_ms）に PR コメントを1回だけ取り込み、対応要否を判断する。
  #
  # ツール権限の前提（消すと静かに壊れる）:
  # - コメント取得に `gh` が要るため `edit: false` にできない。claude provider は
  #   `edit: false`、または `output_contracts` があって `edit` 未指定のとき Bash ごと落とす
  #   （engine-provider-options.js の shouldFilterAllowedTools）。`edit: true` の明示が必須。
  # - `edit: true` だと TAKT が「編集が許可されています」という文を instruction に自動注入するが、
  #   本ステップは編集しない。capabilities で Edit / Write を渡さず、instruction 側でも禁止している。
  # - builtin の `readonly` は無制限の Bash を含むため使わない。`readonly-gh` で
  #   `gh` / `git` / `jq` に絞る（非信頼データである PR コメントを読むステップのため）。
  #
  # delay_before_ms の前提:
  # - resume・プロバイダのフォールバック再実行では、この5分をもう一度待つ。
  # - `claude.guards.callTimeoutMs` を5分未満にすると、応答前に必ずタイムアウトする。
  - name: watch_pr_comments
    tags:
      - review
    edit: true
    persona: supervisor
    knowledge:
      - growmate
    capabilities: readonly-gh
    required_permission_mode: edit
    delay_before_ms: 300000
    instruction: spec-to-pr/pr-comment-triage
    structured_output:
      schema_ref: watch_pr_comments
    rules:
      - condition: when(structured.watch_pr_comments.verdict == "fix_required")
        next: pr_comment_fix
      - condition: when(structured.watch_pr_comments.verdict == "no_action")
        next: record_pr_comments
      - condition: when(structured.watch_pr_comments.verdict == "cannot_check")
        next: ABORT
        appendix: |
          PR またはコメントを取得できず、対応要否を判断できませんでした。**PR は作成/更新済みです**（この ABORT は PR 作成の失敗ではありません）。
          `gh auth status` と対象 PR を人間が確認し、必要ならコメント対応を手動で行ってください。
          再実行する場合、実装からやり直さずに PR 上で対応するほうが安全です（同じコメントを二重に処理しないため）。
    output_contracts:
      report:
        - name: pr-comment-triage.md
          format: spec-to-pr/pr-comment-triage

  # triage が `fix` と判断した指摘だけを修正し、commit / push まで行って完了する。
  # 再 triage には戻さない（コメントは随時増えるため、1周で終える。以降は人間が PR 上で判断する）。
  # 検証ゲートは pre-commit（lint / doc-paths / ui-text）と pre-push（test / build / knip）が担う。
  # instruction 側で `--no-verify` を禁止しているのはこのため。
  - name: pr_comment_fix
    tags:
      - coding
      - implementation
    edit: true
    persona: coder
    policy:
      - coding
    knowledge:
      - growmate
    capabilities: growmate-edit
    required_permission_mode: edit
    allow_git_commit: true
    pass_previous_response: false
    instruction: spec-to-pr/pr-comment-fix
    # quality_gates は置かない。このステップは commit / push まで行うため、ステップ後には
    # working tree が空で `verify:changed` が必ずスキップされる（無意味なゲートになる）。
    # 検証は commit 前にステップ内で実施し（instruction 参照）、push 時は pre-push フックが受ける。
    structured_output:
      schema_ref: pr_comment_fix
    rules:
      - condition: when(structured.pr_comment_fix.verdict == "fixed")
        next: record_pr_comments
      - condition: when(structured.pr_comment_fix.verdict == "stuck")
        next: ABORT
        appendix: |
          PR コメントの指摘を修正しきれませんでした。**PR は作成/更新済みです**（この ABORT は PR 作成の失敗ではありません）。
          作業ツリーに未 commit の差分が残っている可能性があります。次を人間が確認してください。
          - `git status` / `git diff` の残差分（不要なら破棄する）
          - `pr-comment-fix-result.md` の `cannot_fix` 行と、PR 上で引き取るべき指摘
          - 対応結果は PR へ自動記録されていないので、`pr-comment-triage.md` と `pr-comment-fix-result.md` の要点を PR にコメントで残す
          仕様の修正が必要な指摘だった場合は、対象仕様書を直して `spec-review` から再実行してください。
    output_contracts:
      report:
        - name: pr-comment-fix-result.md
          format: coder-decisions
  # PR はカルテ。コメント対応の結果（対応しない判断を含む）を PR コメント1件で残す。
  # 本文は人が最終確認のチェックを入れるため触らない。入力は triage が要約済みのレポートだけ。
  - name: record_pr_comments
    tags:
      - report
    edit: true
    persona: supervisor
    knowledge:
      - growmate
    capabilities: readonly-gh
    required_permission_mode: edit
    pass_previous_response: false
    instruction: spec-to-pr/record-pr-comments
    rules:
      - condition: PR コメント対応を記録した
        next: COMPLETE
      - condition: PR コメント対応を記録できなかった
        next: ABORT
        appendix: |
          PR コメント対応の記録コメントを投稿できませんでした。**PR は作成/更新済みで、コメント対応も終わっています**（この ABORT は記録だけの失敗です）。
          `pr-comment-triage.md` と `pr-comment-fix-result.md` の要点を、人間が PR にコメントで残してください。
