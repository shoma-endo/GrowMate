name: spec-to-pr
description: GrowMate docs/plans specification to implementation, quality gates, architecture review loop, commit, and PR creation with review summary body.
workflow_config:
  provider_options:
    codex:
      network_access: true
  # run 開始前に Cursor / Codex CLI の認証を fail-fast 検査する（review /
  # create_pr が cursor、coder 系・supervisor・内部エージェントが codex のため）。
  # global の prepare（pip/uv キャッシュ設定）を置換するが、本リポジトリは
  # pip を使わないので影響なし。
  runtime:
    prepare:
      - .takt/scripts/check-provider-auth.sh
max_steps: 24
initial_step: plan
loop_monitors:
  - cycle:
      - reviewers
      - fix
    threshold: 3
    judge:
      persona: supervisor
      knowledge:
        - growmate
      instruction: |
        reviewers（AIアンチパターン＋アーキテクチャの並列レビュー） -> fix のループが {cycle_count} 回繰り返されました。
        下記に全文添付された最新のレビュー2本と修正結果を確認し、収束しているか判断してください。run ディレクトリやレポートパスの探索はしないでください。
        残件が「テスト追加要求」のみで、対象仕様書または GrowMate knowledge がテスト追加不要を明示している場合は、追加修正で解消不能な方針差分として readme_sync を経て self_review に進めてください。

        ## ai-antipattern-review.md（最新・全文）
        {report:ai-antipattern-review.md}

        ## architecture-review.md（最新・全文）
        {report:architecture-review.md}

        ## fix-result.md（最新・全文）
        {report:fix-result.md}
      rules:
        - condition: 収束済み（残件が追加修正で解消不能な方針差分のみ）
          next: readme_sync
        - condition: 健全（進捗あり）
          next: reviewers
        - condition: 非生産的（同じ指摘の反復・修正未反映）
          next: ABORT
  - cycle:
      - self_review
      - self_review_fix
      - readme_sync
    threshold: 3
    judge:
      persona: supervisor
      knowledge:
        - growmate
      instruction: |
        self_review -> self_review_fix -> readme_sync のループが {cycle_count} 回繰り返されました。
        下記に全文添付された最新の self-review と修正結果を確認し、収束しているか判断してください。run ディレクトリやレポートパスの探索はしないでください。
        残件が「手動ブラウザ確認未実施」または管理者作業（マイグレーション適用・型再生成・pendingファイル削除）のみの場合は、追加修正で解消不能な残件として prepare_pr_summary に進めてください。

        ## self-review.md（最新・全文）
        {report:self-review.md}

        ## fix-result.md（最新・全文）
        {report:fix-result.md}

        ## readme-sync.md（最新・全文）
        {report:readme-sync.md}
      rules:
        - condition: 収束済み（残件が手動確認・管理者作業のみ、または指摘なし）
          next: prepare_pr_summary
        - condition: 健全（進捗あり）
          next: self_review
        - condition: 非生産的（同じ指摘の反復・修正未反映）
          next: ABORT

steps:
  - name: plan
    tags:
      - plan
    edit: false
    persona: planner
    provider: claude-sdk
    knowledge:
      - architecture
      - growmate
    capabilities: readonly
    instruction: spec-to-pr/plan
    rules:
      - condition: 要件が明確で実装可能、かつ spec-review が対象スコープの未解決事項なしで approved（新規または既存 WIP/PR への差分追記を含む。未適用マイグレーションへの対応は Pending Migration Types パターンで実装可能なため「明確」に含む）
        next: implement
      - condition: ユーザーが質問をしている（実装タスクではない）
        next: COMPLETE
      - condition: 要件が不明確、情報不足（仕様書の修正が必要。マイグレーション未適用のみを理由にしない）
        next: ABORT
        appendix: |
          仕様書の修正が必要です。未回答の質問・実装判断・外部入力・承認ゲートがある場合は、回答と確定した仕様を対象仕様書へ反映して
          `.takt/workflows/spec-review.yaml` を先に再実行してください。`spec-review` が対象スコープの未解決事項なしで approved になった後、
          この workflow を再実行してください。
          - {質問1}
          - {質問2}
    output_contracts:
      report:
        - name: plan.md
          format: plan

  - name: implement
    tags:
      - coding
      - implementation
    edit: true
    persona: coder
    policy:
      - coding
    knowledge:
      - growmate
    provider_options:
      extends: edit
    required_permission_mode: edit
    instruction: spec-to-pr/implement
    quality_gates:
      - type: command
        name: npm-verify
        command: npm run verify
        cwd: .
        timeout_ms: 900000
    rules:
      - condition: 実装と必須検証が完了した（必須検証＝quality_gates の `npm run verify` 成功。マイグレーションのリモート適用・実DB/RLS実環境・外部API/LLM実通信・ブラウザ表示確認は無人運用の検証対象外であり、未実施はこの条件の選択を妨げない。レポートの未確認範囲に記載して先へ進む）
        next: reviewers
      - condition: 対象仕様書が plan.md 作成後に変更されており、実装方針の再検討が必要
        next: plan
      - condition: 判断できない、情報不足（仕様書の修正が必要。無人運用で実施不能な検証〔実DB・実API・ブラウザ・マイグレーション適用〕の未実施だけを理由にこの条件を選ばない）
        next: ABORT
    output_contracts:
      report:
        - name: coder-scope.md
          format: coder-scope
        - name: coder-decisions.md
          format: coder-decisions
        - name: implement-report.md
          format: implementation-report
  # レビュー2系統（AIアンチパターン / アーキテクチャ）を並列実行する。
  # どちらも read-only で作業ツリーを変更しないため同時実行できる。指摘の修正は fix 1本に統合。
  - name: reviewers
    parallel:
      - name: ai_antipattern_review
        session_key: ai-antipattern-review
        tags:
          - review
        edit: false
        persona: ai-antipattern-reviewer
        policy:
          - review
          - ai-antipattern
        knowledge:
          - growmate
        capabilities: readonly
        instruction: ai-antipattern-review
        rules:
          - condition: approved
          - condition: needs_fix
        output_contracts:
          report:
            - name: ai-antipattern-review.md
              format: ai-antipattern-review
      - name: review
        session_key: architecture-review
        tags:
          - review
        edit: false
        persona: architecture-reviewer
        knowledge:
          - architecture
          - growmate
        capabilities: readonly
        rules:
          - condition: approved
          - condition: needs_fix
        output_contracts:
          report:
            - name: architecture-review.md
              format: architecture-review
        instruction: spec-to-pr/architecture-review
    rules:
      - condition: all("approved")
        next: readme_sync
      - condition: any("needs_fix")
        next: fix

  - name: fix
    tags:
      - coding
      - implementation
    edit: true
    persona: coder
    policy:
      - coding
    knowledge:
      - growmate
    provider_options:
      extends: edit
    required_permission_mode: edit
    pass_previous_response: false
    instruction: spec-to-pr/fix
    quality_gates:
      - type: command
        name: npm-verify
        command: npm run verify
        cwd: .
        timeout_ms: 900000
    structured_output:
      schema_ref: fix
    rules:
      - condition: when(structured.fix.verdict == "fixed")
        next: reviewers
      - condition: when(structured.fix.verdict == "info_missing")
        next: plan
      - condition: when(structured.fix.verdict == "spec_changed")
        next: plan
      - condition: when(structured.fix.verdict == "stuck")
        next: ABORT
    output_contracts:
      report:
        - name: fix-result.md
          format: coder-decisions
        - name: fix-report.md
          format: implementation-report

  - name: self_review_fix
    tags:
      - coding
      - implementation
    edit: true
    persona: coder
    policy:
      - coding
    knowledge:
      - growmate
    provider_options:
      extends: edit
    required_permission_mode: edit
    pass_previous_response: false
    instruction: spec-to-pr/self-review-fix
    quality_gates:
      - type: command
        name: npm-verify
        command: npm run verify
        cwd: .
        timeout_ms: 900000
    structured_output:
      schema_ref: self_review_fix
    rules:
      - condition: when(structured.self_review_fix.verdict == "fixed")
        next: readme_sync
      - condition: when(structured.self_review_fix.verdict == "arch_impact")
        next: reviewers
      - condition: when(structured.self_review_fix.verdict == "info_missing")
        next: plan
      - condition: when(structured.self_review_fix.verdict == "stuck")
        next: ABORT
    output_contracts:
      report:
        - name: fix-result.md
          format: coder-decisions
        - name: self-review-fix-report.md
          format: implementation-report

  - name: readme_sync
    tags:
      - coding
      - documentation
    edit: true
    persona: coder
    policy:
      - coding
    knowledge:
      - growmate
    provider_options:
      extends: edit
    required_permission_mode: edit
    instruction: spec-to-pr/readme-sync
    structured_output:
      schema_ref: readme_sync
    rules:
      - condition: when(structured.readme_sync.verdict == "done")
        next: self_review
      - condition: when(structured.readme_sync.verdict == "cannot_judge")
        next: ABORT
    output_contracts:
      report:
        - name: readme-sync.md
          format: coder-decisions

  - name: self_review
    tags:
      - review
    edit: false
    persona: supervisor
    knowledge:
      - growmate
    capabilities: readonly
    instruction: spec-to-pr/self-review
    structured_output:
      schema_ref: self_review
    rules:
      - condition: when(structured.self_review.verdict == "pass")
        next: prepare_pr_summary
      - condition: when(structured.self_review.verdict == "needs_fix")
        next: self_review_fix
      - condition: when(structured.self_review.verdict == "cannot_verify")
        next: ABORT
    output_contracts:
      report:
        - name: self-review.md
          format: supervisor-validation
  - name: prepare_pr_summary
    tags:
      - report
    edit: false
    persona: reporter
    knowledge:
      - growmate
    capabilities: readonly
    instruction: spec-to-pr/pr-summary
    rules:
      - condition: PR 本文正本（pr-summary.md）が完了した
        next: create_pr
      - condition: 添付レポートの内容が欠落・破損しており、レビュー結果を確認できない
        next: ABORT
    output_contracts:
      report:
        - name: pr-summary.md
          format: summary

  - name: create_pr
    tags:
      - coding
    edit: true
    persona: coder
    provider: cursor
    model: gpt-5.6-luna-high
    knowledge:
      - growmate
    required_permission_mode: edit
    allow_git_commit: true
    instruction: spec-to-pr/create-pr
    rules:
      - condition: コミット・push・PR 作成または更新が完了した（create 失敗後の re-list → edit 成功、既存 PR 追記を含む）
        next: COMPLETE
      - condition: コミット、push、または PR 作成/更新に失敗した（re-list → edit でも回復できない場合）
        next: ABORT
