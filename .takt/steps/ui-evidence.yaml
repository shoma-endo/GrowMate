# UI 変更があるときだけ、決めた画面幅で対象画面と既存の類似画面を測ってスクリーンショットを撮る。
# frontend_review（reviewers の pool）と final_gate がこのレポートを根拠にする。
# spec-to-pr の ui_evidence（fix の後 → reviewers）と ui_evidence_recheck（self_review_fix の後 → self_review）が使う。
# 遷移先が違うため rules は呼び出し側に置く。
#
# ツール権限の前提: claude provider は `edit: false` だと Bash ごと落とすため `edit: true` を明示し、
# capabilities で Bash を計測スクリプト1本に絞る。上限: `edit: true` は権限の下限を edit に固定し、Claude SDK の
# acceptEdits は allowed_tools に無い Edit / Write も通す（TAKT 0.71 に禁止リストの設定は無い）。編集の禁止は
# instruction 頼みで、紛れた差分は後段のレビューの差分に出る。TAKT に禁止リストが入ったらそちらで塞ぐ。
tags:
  - review
edit: true
persona: supervisor
session_key: ui-evidence
session: refresh
knowledge:
  - growmate
capabilities: growmate-ui-evidence
pass_previous_response: false
instruction: spec-to-pr/ui-evidence
structured_output:
  schema_ref: ui_evidence
output_contracts:
  report:
    - name: ui-evidence.md
      format: |
        # UI 証跡
        - 判定: captured / not_applicable / cannot_capture
        - 実行したコマンドと終了コード
        - スクリプトの標準出力（Markdown のまま）
